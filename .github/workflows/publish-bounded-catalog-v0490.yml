name: Publish Nuvio bounded catalog v0.4.90
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-bounded-catalog-v0490.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply bounded home/catalog scrolling and return-to-start controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/bounded-catalog-scroll-v0490.yml').read_text(encoding='utf-8')
          delimiter="          python3 - <<'PY'\n"
          start=workflow.index(delimiter)+len(delimiter)
          end=workflow.index('\n          PY\n',start)
          source='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(source,'bounded-catalog-v0490.patch','exec'),{'__name__':'__main__'})
          PY
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          echo 'PASS: Nuvio catalog update and JavaScript syntax'
      - name: Commit and publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bounded-catalog-scroll-v0490.yml
          git add custom_components/nuvio/manifest.json custom_components/nuvio/frontend/nuvio-card.js
          git commit -m 'feat: bounded Nuvio home/catalog scrolling and back to beginning (v0.4.90)'
          git push origin HEAD:main
          gh release create v0.4.90 --target "$(git rev-parse HEAD)" --title v0.4.90 --notes 'Bound Nuvio Home and expanded catalog vertical scroll inside the card, keep controls visible, preserve scroll positions and add return-to-beginning buttons.'
