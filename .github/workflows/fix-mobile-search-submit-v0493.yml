name: Publish Nuvio touch-friendly search v0.4.93
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-search-submit-v0493.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add mobile search submit and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          file=Path('custom_components/nuvio/frontend/nuvio-card.js')
          text=file.read_text(encoding='utf-8')
          def replace_once(old,new,label):
              global text
              n=text.count(old)
              if n!=1: raise RuntimeError(f'{label}: expected exactly one anchor, found {n}')
              text=text.replace(old,new,1)
          replace_once('''? '<div class="search"><ha-icon icon="mdi:magnify"></ha-icon><input id="search" value="'+this.esc(this._query)+'" placeholder="Search Nuvio…"></div>' ''', '''? '<div class="search"><input id="search" type="search" enterkeyhint="search" aria-label="Search Nuvio" value="'+this.esc(this._query)+'" placeholder="Search Nuvio…"><button type="button" class="search-submit" id="searchSubmit" title="Search" aria-label="Search"><ha-icon icon="mdi:magnify"></ha-icon></button></div>' ''', 'touch-friendly search markup')
          replace_once('''.search input{border:0;''', '''.search-submit{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;padding:0;margin:0;border:0;border-radius:50%;background:transparent;color:var(--primary-text-color);cursor:pointer;touch-action:manipulation}.search-submit ha-icon{--mdc-icon-size:23px}.search-submit:focus-visible{outline:2px solid var(--primary-color)}.search input{min-width:0;flex:1 1 auto;border:0;''', 'button touch target and input sizing')
          replace_once('''    if(q){q.addEventListener("input",e=>this._query=e.target.value);q.addEventListener("keydown",e=>{if(e.key==="Enter")this.search();});}''', '''    if(q){
      const submitSearch=()=>{this._query=q.value;q.blur();void this.search();};
      q.addEventListener("input",e=>this._query=e.target.value);
      q.addEventListener("keydown",e=>{
        if(e.key==="Enter"&&!e.isComposing){e.preventDefault();submitSearch();}
      });
      r.querySelector("#searchSubmit")?.addEventListener("click",submitSearch);
    }''', 'tap and keyboard submission')
          replace_once('v0.4.92</span>', 'v0.4.93</span>', 'card display version')
          file.write_text(text,encoding='utf-8')
          manifest_file=Path('custom_components/nuvio/manifest.json')
          manifest=json.loads(manifest_file.read_text(encoding='utf-8'))
          if manifest.get('version')!='0.4.92': raise RuntimeError('Unexpected Nuvio manifest version')
          manifest['version']='0.4.93'
          manifest_file.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert 'id="searchSubmit"' in text and 'enterkeyhint="search"' in text and 'addEventListener("click",submitSearch)' in text
          print('PASS: touch search button, keyboard submit, and version updated')
          PY
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          echo 'PASS: Nuvio JS syntax and JSON manifest'
      - name: Commit and publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json
          git commit -m 'fix: touch-friendly Nuvio search submit (v0.4.93)'
          git push origin HEAD:main
          gh release create v0.4.93 --target "$(git rev-parse HEAD)" --title v0.4.93 --notes 'Add an accessible, touch-friendly Search button inside the Nuvio search bar, retain desktop Enter submission, and request a Search key on mobile keyboards.'
