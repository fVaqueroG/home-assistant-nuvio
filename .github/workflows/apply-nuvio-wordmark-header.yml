name: Apply Nuvio wordmark header

on:
  push:
    branches:
      - feature/nuvio-wordmark-header
    paths:
      - .github/workflows/apply-nuvio-wordmark-header.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace card heading with Nuvio wordmark and retain text fallback
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/nuvio')
          file = root / 'frontend/nuvio-card.js'
          source = file.read_text(encoding='utf-8')
          original = '<h2>\'+this.esc(this._config.title||"Nuvio")+\'</h2>'
          replacement = '<img class="nuvio-wordmark" src="https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp" alt="Nuvio" decoding="async" style="display:none;height:38px;max-width:150px;width:auto;object-fit:contain"><h2 class="nuvio-wordmark-fallback">\'+this.esc(this._config.title||"Nuvio")+\'</h2>'
          if source.count(original) != 1:
              raise SystemExit('Could not identify the unique Nuvio header heading; no changes made')
          source = source.replace(original, replacement, 1)
          original_wire = '  wire(){\n    var r=this.shadowRoot,q=r.querySelector("#search");\n'
          extra = (
              '    var wordmark=r.querySelector(".nuvio-wordmark"),fallback=r.querySelector(".nuvio-wordmark-fallback");\n'
              '    if(wordmark&&fallback){\n'
              '      var showWordmark=()=>{\n'
              '        var loaded=wordmark.complete&&wordmark.naturalWidth>0;\n'
              '        wordmark.style.display=loaded?"block":"none";\n'
              '        fallback.style.display=loaded?"none":"";\n'
              '      };\n'
              '      wordmark.addEventListener("load",showWordmark);\n'
              '      wordmark.addEventListener("error",showWordmark);\n'
              '      showWordmark();\n'
              '    }\n'
          )
          if source.count(original_wire) != 1:
              raise SystemExit('Could not identify the card wire() anchor; no changes made')
          source = source.replace(original_wire, original_wire + extra, 1)
          if 'NUVIO-CARD v0.4.69' not in source or '<span class="card-version">v0.4.69</span>' not in source:
              raise SystemExit('Unexpected frontend version')
          source = source.replace('v0.4.69', 'v0.4.70')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] != '0.4.69':
              raise SystemExit('Unexpected integration version')
          manifest['version'] = '0.4.70'
          file.write_text(source, encoding='utf-8')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate Nuvio frontend and integration
        shell: bash
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python - <<'PY'
          from pathlib import Path
          s = Path('custom_components/nuvio/frontend/nuvio-card.js').read_text()
          assert 'src="https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp"' in s
          assert 'class="nuvio-wordmark-fallback"' in s
          assert 'wordmark.addEventListener("load",showWordmark)' in s
          assert 'wordmark.addEventListener("error",showWordmark)' in s
          assert '<span class="card-version">v0.4.70</span>' in s
          assert 'NUVIO-CARD v0.4.70' in s
          print('Wordmark, fallback, and card version checks passed.')
          PY
          npm ci --prefix tests
          node tests/test_card.cjs
          python -m compileall -q custom_components/nuvio
      - name: Commit tested changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json
          git commit -m 'Use Nuvio wordmark in card header (v0.4.70)'
          git push origin HEAD:feature/nuvio-wordmark-header
