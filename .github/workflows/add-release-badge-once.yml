name: Add Nuvio latest release README badge (one-time)
on:
  push:
    branches:
      - fix/hacs-readme-latest-release-badge
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add badge to README
        run: python3 .github/scripts/add_release_badge_once.py
      - name: Validate documentation-only change
        shell: bash
        run: |
          grep -Fq '![Latest release](https://img.shields.io/github/v/release/fVaqueroG/home-assistant-nuvio?label=latest%20release)' README.md
          grep -Fq 'releases/latest' README.md
          git diff --check
      - name: Commit README only and remove temporary patch utility
        shell: bash
        run: |
          git rm -f .github/workflows/add-release-badge-once.yml .github/scripts/add_release_badge_once.py
          git add README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Display dynamic Latest release badge in Nuvio HACS README'
          git push
