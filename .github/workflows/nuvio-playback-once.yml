name: Apply exact Nuvio playback fix (one-time)
on:
  push:
    branches:
      - release/0.4.63-exact-stream-relaunch
    paths:
      - .github/workflows/nuvio-playback-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.63-exact-stream-relaunch
      - name: Patch playback routing
        run: python scripts/apply_playback_fix_once.py
      - name: Validate integration and card
        run: |
          python -m compileall -q custom_components/nuvio
          node --check custom_components/nuvio/frontend/nuvio-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
          python - <<'PY'
          from pathlib import Path
          code=Path('custom_components/nuvio/launcher.py').read_text()
          assert code.count('"--activity-single-top"') >= 2
          assert 'if launch_mode != "player" or not stream_url:' in code
          card=Path('custom_components/nuvio/frontend/nuvio-card.js').read_text()
          assert 'opening the title would not play the selected source' in card
          print('Playback routing regression checks passed')
          PY
      - name: Commit only application and regression files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/launcher.py custom_components/nuvio/__init__.py custom_components/nuvio/manifest.json tests/test_card.cjs tests/test_launcher.py
          git commit -m 'Fix exact Nuvio stream launches and repeated playback intents (v0.4.63)'
          git push origin HEAD:release/0.4.63-exact-stream-relaunch
