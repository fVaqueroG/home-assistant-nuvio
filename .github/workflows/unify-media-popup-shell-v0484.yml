name: Unified media popup shell v0.4.84
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-media-popup-shell-v0484.yml
permissions:
  contents: write
jobs:
  unify-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply the shared popup dimensions and header to source and served bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('custom_components/nuvio')
          source_file = root / 'frontend/nuvio-popup-card.js'
          served_file = root / 'frontend/nuvio-card.js'
          manifest_file = root / 'manifest.json'
          popup = source_file.read_text(encoding='utf-8')
          served = served_file.read_text(encoding='utf-8')
          marker = '// Nuvio popup button. Bundled after nuvio-card.js so HACS loads both card types'
          assert popup.startswith(marker) and served.count(marker) == 1
          def replace_once(old, new):
              global popup
              assert popup.count(old) == 1, f'Expected exactly one popup rule: {old[:85]}'
              popup = popup.replace(old, new, 1)
          replace_once('.nuvio-popup-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:12px;box-sizing:border-box}',
                       '.nuvio-popup-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:12px;box-sizing:border-box}') if False else None
          replace_once('.nuvio-popup-frame{width:min(1180px,96vw);max-width:96vw;height:min(1050px,92dvh);max-height:92dvh;min-width:0;',
                       '.nuvio-popup-frame{width:min(1440px,calc(100vw - 24px));max-width:calc(100vw - 24px);height:min(900px,calc(100dvh - 24px));max-height:calc(100dvh - 24px);min-width:0;')
          replace_once('.nuvio-popup-overlay[data-size="normal"] .nuvio-popup-frame{width:min(850px,96vw)}',
                       '.nuvio-popup-overlay[data-size="normal"] .nuvio-popup-frame{width:min(900px,calc(100vw - 24px));height:min(700px,calc(100dvh - 24px))}')
          replace_once('.nuvio-popup-top{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 20px;border-bottom:1px solid var(--divider-color);font:600 16px var(--paper-font-body1_-_font-family,inherit)}',
                       '.nuvio-popup-top{height:48px;min-height:48px;box-sizing:border-box;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 20px;border-bottom:1px solid var(--divider-color);font:600 16px var(--paper-font-body1_-_font-family,inherit)}')
          replace_once('.nuvio-popup-top button{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;background:var(--secondary-background-color);color:var(--primary-text-color)}',
                       '.nuvio-popup-top button{box-sizing:border-box;flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;cursor:pointer;background:var(--secondary-background-color);color:var(--primary-text-color)}')
          replace_once('@media(max-width:600px){.nuvio-popup-overlay{padding:0}.nuvio-popup-frame{width:100%;height:100%;border-radius:0}.nuvio-popup-top{height:44px;flex-basis:44px}}',
                       '@media(max-width:600px){.nuvio-popup-overlay{padding:0}.nuvio-popup-frame{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}.nuvio-popup-top{height:44px;min-height:44px;flex-basis:44px;padding:0 8px 0 12px}}')
          source_file.write_text(popup, encoding='utf-8')
          prefix, _ = served.split(marker, 1)
          assert 'console.info("NUVIO-CARD v0.4.83");' in prefix
          prefix = prefix.replace('console.info("NUVIO-CARD v0.4.83");', 'console.info("NUVIO-CARD v0.4.84");', 1)
          served_file.write_text(prefix + popup.rstrip() + '\n', encoding='utf-8')
          manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.83', manifest['version']
          manifest['version'] = '0.4.84'
          manifest_file.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          assert served_file.read_text(encoding='utf-8').split(marker, 1)[1] == popup[len(marker):].rstrip() + '\n'
          assert served_file.read_text(encoding='utf-8').count('class NuvioPopupCard extends HTMLElement') == 1
          print('PASS: Nuvio popup 900x700 Normal, 1440x900 Wide, shared 48/44px header, synchronized served bundle.')
          PY
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
      - name: Commit and release v0.4.84
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json
          git commit -m 'v0.4.84: standardize Nuvio popup dimensions and header'
          git push origin HEAD:main
          gh release create v0.4.84 --target "$(git rev-parse HEAD)" --title 'v0.4.84' --notes 'Use the same Normal (900 x 700), Wide (1440 x 900) and Full-screen popup sizing and 48px desktop / 44px mobile header as Totalplay and Streaming Browser. Keep existing branding, catalog, controls and visual editor. Synchronize the production served Nuvio card bundle with popup source.'