name: Apply logo-only Nuvio popup launcher
on:
  push:
    branches:
      - feature/popup-logo-only-launcher
    paths:
      - .github/workflows/apply-logo-only-popup.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/popup-logo-only-launcher
      - name: Add logo-only launcher to standalone and bundled cards
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text, before, after, label):
              count = text.count(before)
              assert count == 1, f'{label}: expected exactly one match, got {count}'
              return text.replace(before, after, 1)

          path = Path('custom_components/nuvio/frontend/nuvio-popup-card.js')
          popup = path.read_text()
          popup = replace_once(popup, '["vertical", "horizontal", "icon_text"].includes(style)', '["vertical", "horizontal", "logo_only", "icon_text"].includes(style)', 'launcher styles')
          popup = replace_once(popup, 'logo.className = style === "vertical" ? "launcher-mark" : "launcher-logo";', 'logo.className = ["vertical", "logo_only"].includes(style) ? "launcher-mark" : "launcher-logo";', 'logo mark class')
          popup = replace_once(popup, 'logo.src = style === "vertical"', 'logo.src = ["vertical", "logo_only"].includes(style)', 'logo mark source')
          popup = replace_once(popup, 'fallback.textContent = style === "vertical" ? "N" : "Nuvio";', 'fallback.textContent = ["vertical", "logo_only"].includes(style) ? "N" : "Nuvio";', 'fallback branding')
          popup = replace_once(popup, '// Horizontal wordmark already includes the brand name; stacked logo\n  // and icon layouts always show the configured caption below/beside.\n  caption.style.display = style === "horizontal" && label.trim().toLowerCase() === "nuvio" ? "none" : "";', '// The logo-only mark must never show a caption; the horizontal wordmark\n  // already includes the default brand name. Other layouts show the label.\n  caption.style.display = style === "logo_only" || (style === "horizontal" && label.trim().toLowerCase() === "nuvio") ? "none" : "";', 'logo-only caption')
          popup = replace_once(popup, '<option value="horizontal">Horizontal logo</option><option value="icon_text">Icon + text</option>', '<option value="horizontal">Horizontal logo</option><option value="logo_only">Logo only</option><option value="icon_text">Icon + text</option>', 'appearance dropdown')
          popup = replace_once(popup, '["vertical","horizontal","icon_text"].includes(this._config.button_style)', '["vertical","horizontal","logo_only","icon_text"].includes(this._config.button_style)', 'editor allowed styles')
          path.write_text(popup)

          bundle_path = Path('custom_components/nuvio/frontend/nuvio-card.js')
          bundle = bundle_path.read_text()
          marker = '// Nuvio popup button. Bundled after nuvio-card.js so HACS loads both card types'
          assert bundle.count(marker) == 1, 'Cannot locate exactly one bundled popup section'
          main, _old_popup = bundle.split(marker, 1)
          assert main.count('v0.4.72') == 2, 'Unexpected card version markers'
          bundle_path.write_text(main.replace('v0.4.72', 'v0.4.73') + popup[popup.index(marker):])

          manifest_path = Path('custom_components/nuvio/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          assert manifest['version'] == '0.4.72', 'Version moved; do not overwrite newer changes'
          manifest['version'] = '0.4.73'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          docs_path = Path('docs/popup-card.md')
          docs = docs_path.read_text()
          docs += '\nChoose `button_style: logo_only` for an icon-sized launcher showing only the official Nuvio logo mark, with no text even when `button_label` is configured. The visual editor offers **Logo only** under **Button appearance**. This setting controls only the dashboard launcher; `popup_width` and existing rooms, TVs, and playback settings are unchanged.\n'
          docs_path.write_text(docs)

          test_path = Path('tests/test_card.cjs')
          tests = test_path.read_text()
          insertion = '''// Logo-only: Nuvio's official mark, without either caption or MDI icon.
          launcher.setConfig({type:'custom:nuvio-popup-card',button_style:'logo_only',button_label:'Custom label',button_icon:'mdi:star',popup_width:'normal'});
          assert.equal(launcher.launcherStyle(),'logo_only');
          assert.equal(launcher.getCardSize(),1);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-mark').getAttribute('src'),'https://raw.githubusercontent.com/NuvioMedia/NuvioTVSmart/main/assets/brand/app_logo_mark.png');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-logo'),null);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon'),null);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-caption').style.display,'none');
          assert.equal(launcher.shadowRoot.querySelector('button').getAttribute('aria-label'),'Open Nuvio');
          assert.match(cardSource,/<option value="logo_only">Logo only<\\/option>/);
          assert.match(cardSource,/"logo_only","icon_text"\\]\\.includes\\(this\\._config\\.button_style\\)/);
          '''
          marker_test = 'launcher.remove();\n// Home Assistant discovers the native visual editor'
          tests = replace_once(tests, marker_test, insertion + marker_test, 'popup regression insertion')
          test_path.write_text(tests)
          print('Implemented logo-only popup launcher in source and bundled frontend; updated version, docs, and regression tests.')
          PY
      - name: Validate frontend source, bundle, and existing regression tests
        shell: bash
        run: |
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
          grep -F 'NUVIO-CARD v0.4.73' custom_components/nuvio/frontend/nuvio-card.js
          grep -F '<span class="card-version">v0.4.73</span>' custom_components/nuvio/frontend/nuvio-card.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json docs/popup-card.md tests/test_card.cjs
          git commit -m 'Add logo-only Nuvio popup appearance (v0.4.73)'
          git push origin HEAD:feature/popup-logo-only-launcher
