name: Add Nuvio card themes v0.4.86
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-light-dark-system-themes-v0486.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement Light Dark and System in full and popup cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('custom_components/nuvio')
          main=root/'frontend/nuvio-card.js'
          popup=root/'frontend/nuvio-popup-card.js'
          m=main.read_text()
          p=popup.read_text()
          def once(text,old,new,where):
              count=text.count(old)
              assert count==1, f'{where}: expected one anchor, got {count}: {old[:100]!r}'
              return text.replace(old,new,1)
          helper='''function nuvioThemeStyle(target, choice) {
            if (!target) return;
            const palettes = {
              light: {'--card-background-color':'#ffffff','--ha-card-background':'#ffffff','--primary-text-color':'#182436','--secondary-text-color':'#58697d','--secondary-background-color':'#edf2f7','--divider-color':'#d8e0e9','--ha-card-border-color':'#d8e0e9'},
              dark: {'--card-background-color':'#171b24','--ha-card-background':'#171b24','--primary-text-color':'#f2f5fb','--secondary-text-color':'#aab6c8','--secondary-background-color':'#283142','--divider-color':'#465267','--ha-card-border-color':'#465267'}
            };
            for (const key of Object.keys(palettes.light)) target.style.removeProperty(key);
            target.style.removeProperty('color-scheme');
            if (Object.hasOwn(palettes, choice)) {
              for (const [key,value] of Object.entries(palettes[choice])) target.style.setProperty(key,value);
              target.style.setProperty('color-scheme',choice);
            }
          }
          '''
          m=helper+m
          p=helper+p
          # Full-size card: apply only locally scoped palette variables, never modify HA's global theme.
          m=once(m,'  setConfig(c){\n    this._config=Object.assign({title:"Nuvio",columns:6,show_search:true,show_remote:true,remote_side:"left"},c||{});', '''  _refreshCardTheme(){
            nuvioThemeStyle(this,this._config.theme);
            const portal=document.getElementById('nuvio-remote-portal');
            if (this._remoteExpanded && portal) {
              const mode=this._config.theme;
              portal.dataset.nuvioTheme=mode==='light'||mode==='dark' ? mode : (this._hass?.themes?.darkMode ? 'dark' : 'light');
            }
          }
          setConfig(c){
            this._config=Object.assign({title:"Nuvio",columns:6,show_search:true,show_remote:true,remote_side:"left",theme:"system"},c||{});
            this._refreshCardTheme();''','full config')
          m=once(m,'  set hass(h){ this._hass=h; if(!this._loaded&&!this._loading&&!this._homeRetryTimer&&(this._homeRetryCount||0)<3)this.loadHome(); }','  set hass(h){ this._hass=h; this._refreshCardTheme(); if(!this._loaded&&!this._loading&&!this._homeRetryTimer&&(this._homeRetryCount||0)<3)this.loadHome(); }','full hass')
          m=once(m,'  static getStubConfig(){ return {title:"Nuvio",columns:6,show_remote:true,remote_side:"left"}; }','  static getStubConfig(){ return {title:"Nuvio",columns:6,show_remote:true,remote_side:"left",theme:"system"}; }','full stub')
          m=once(m,'        <label>Card title<input type="text" data-field="title" value="${this.esc(cfg.title==null?"Nuvio":cfg.title)}"></label>', '''        <label>Card title<input type="text" data-field="title" value="${this.esc(cfg.title==null?"Nuvio":cfg.title)}"></label>
                  <label>Theme<select data-field="theme"><option value="system" ${(cfg.theme||'system')==='system'?'selected':''}>System (Home Assistant)</option><option value="light" ${cfg.theme==='light'?'selected':''}>Light</option><option value="dark" ${cfg.theme==='dark'?'selected':''}>Dark</option></select></label>''','visual editor')
          # The remote is a body-mounted portal with its own hardcoded dark CSS; theme it independently.
          m=once(m,'    (document.body||document.documentElement).appendChild(portal);\n  }', '''    const remoteTheme=document.createElement('style');
            remoteTheme.textContent=`#nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-shell{background:#fff!important;color:#182436!important;border-color:#d8e0e9!important}
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-head{color:#58697d!important}
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-close,
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-wake-btn,
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-number-pad button,
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-volume-row button,
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-footer button{background:#edf2f7!important;color:#182436!important}
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-ring{background:radial-gradient(circle at center,#edf2f7 0 34%,#d8e0e9 35% 100%)!important}
              #nuvio-remote-portal[data-nuvio-theme="light"] .nuvio-remote-ring .nuvio-ring-btn{color:#182436!important}`;
            portal.appendChild(remoteTheme);
            (document.body||document.documentElement).appendChild(portal);
            this._refreshCardTheme();
          }''','remote portal')
          # Popup button has its own host and creates a body-mounted overlay. The nested full card receives the same theme config.
          def update_popup(text):
              text=once(text,'    this._config = {...config};\n    this.render();','    this._config = {...config};\n    this.render();\n    this._refreshPopupTheme();','popup config')
              text=once(text,'    this._hass = value;\n    if (this._popupCard) this._popupCard.hass = value;','    this._hass = value;\n    this._refreshPopupTheme();\n    if (this._popupCard) this._popupCard.hass = value;','popup hass')
              text=once(text,'  set hass(value) {\n    this._hass = value;', '''  _refreshPopupTheme() {
                nuvioThemeStyle(this,this._config.theme);
                const frame=this._overlay?.querySelector('.nuvio-popup-frame');
                if (frame) nuvioThemeStyle(frame,this._config.theme);
              }
              set hass(value) {
                this._hass = value;''','popup helper')
              text=once(text,'    (document.body || document.documentElement).appendChild(overlay);\n    card.hass = this._hass;', '    (document.body || document.documentElement).appendChild(overlay);\n    this._refreshPopupTheme();\n    card.hass = this._hass;','popup overlay')
              return text
          m=update_popup(m)
          p=update_popup(p)
          m=once(m,'console.info("NUVIO-CARD v0.4.85");','console.info("NUVIO-CARD v0.4.86");','console version')
          m=once(m,'<span class="card-version">v0.4.79</span>','<span class="card-version">v0.4.86</span>','visible version')
          manifest=root/'manifest.json'
          version=json.loads(manifest.read_text())
          assert version['version']=='0.4.85',version['version']
          version['version']='0.4.86'
          main.write_text(m)
          popup.write_text(p)
          manifest.write_text(json.dumps(version,indent=2)+'\n')
          print('Added Light, Dark and System to Nuvio main/popup visual editor and surfaces')
          PY
      - name: Validate JavaScript and manifest
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          grep -q 'data-field="theme"' custom_components/nuvio/frontend/nuvio-card.js
          grep -q 'NUVIO-CARD v0.4.86' custom_components/nuvio/frontend/nuvio-card.js
      - name: Commit verified changes and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-light-dark-system-themes-v0486.yml
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/manifest.json
          git commit -m 'v0.4.86: add light, dark and system card themes'
          git push origin HEAD:main
          gh release create v0.4.86 --target "$(git rev-parse HEAD)" --title v0.4.86 --notes 'Add Light, Dark and System to the full Nuvio card and popup button, configurable in the visual editor. The System option follows the Home Assistant theme.'