name: Nuvio bounded catalog scrolling and return to beginning v0.4.90
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bounded-catalog-scroll-v0490.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bound Nuvio Home and expanded catalog scrolling without changing remote or catalog state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path('custom_components/nuvio')
          manifest=base/'manifest.json'
          metadata=json.loads(manifest.read_text(encoding='utf-8'))
          assert metadata['version']=='0.4.89', f"Unexpected base version: {metadata['version']}"
          path=base/'frontend/nuvio-card.js'
          source=path.read_text(encoding='utf-8')
          def replace_once(old,new):
              global source
              count=source.count(old)
              assert count==1, f'Expected one occurrence of {old[:100]!r}; found {count}'
              source=source.replace(old,new,1)
          replace_once('.catalog-view{display:flex;flex-direction:column;min-height:0}',
              '''.nuvio-home-scroll{height:min(64dvh,680px);min-height:180px;max-width:100%;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable}.nuvio-home-toolbar,.nuvio-catalog-quick-nav{display:flex;align-items:center;justify-content:flex-end;padding:8px 20px;background:var(--card-background-color);border-bottom:1px solid var(--divider-color)}.nuvio-scroll-start{border:1px solid var(--divider-color);border-radius:18px;background:var(--secondary-background-color);color:var(--primary-text-color);padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}.nuvio-scroll-start:focus-visible{outline:2px solid var(--primary-color)}.catalog-view{display:flex;flex-direction:column;min-height:0}''')
          replace_once('.catalog-scroll{height:clamp(320px,calc(100dvh - 300px),780px);',
              '.catalog-scroll{height:min(64dvh,680px);')
          replace_once("+'</h3></div>'+tabs+'</div><div class=\"catalog-scroll\">'",
              "+'</h3></div>'+tabs+'<div class=\"nuvio-catalog-quick-nav\"><button type=\"button\" class=\"nuvio-scroll-start\" title=\"Back to beginning\" aria-label=\"Back to beginning\">↑ Beginning</button></div></div><div class=\"catalog-scroll\">'")
          replace_once('    r.querySelector("#homeTop")?.addEventListener("click",()=>this.goHome());',
              '''    r.querySelectorAll(".nuvio-scroll-start").forEach(button=>button.addEventListener("click",()=>{
      this.shadowRoot.querySelector(".nuvio-home-scroll, .catalog-scroll")?.scrollTo({top:0,behavior:"smooth"});
    }));
    r.querySelector("#homeTop")?.addEventListener("click",()=>this.goHome());''')
          replace_once('    var oldScroller=this.shadowRoot.querySelector(".catalog-scroll");',
              '''    var oldHomeScroller=this.shadowRoot.querySelector(".nuvio-home-scroll");
    if(oldHomeScroller)this._nuvioHomeScrollTop=oldHomeScroller.scrollTop;
    var oldScroller=this.shadowRoot.querySelector(".catalog-scroll");''')
          replace_once('    var content=this._config.show_remote===false\n      ? body',
              '''    if(this._view==="home")body='<div class="nuvio-home-toolbar"><button type="button" class="nuvio-scroll-start" title="Back to beginning" aria-label="Back to beginning">↑ Beginning</button></div><div class="nuvio-home-scroll">'+body+'</div>';
    var content=this._config.show_remote===false
      ? body''')
          replace_once('    if(newScroller)newScroller.scrollTop=scrollTop;',
              '''    if(newScroller)newScroller.scrollTop=scrollTop;
    var homeScroller=this.shadowRoot.querySelector(".nuvio-home-scroll");
    if(homeScroller)homeScroller.scrollTop=this._nuvioHomeScrollTop||0;''')
          replace_once('v0.4.89','v0.4.90')
          path.write_text(source,encoding='utf-8')
          metadata['version']='0.4.90'
          manifest.write_text(json.dumps(metadata,indent=2)+'\n',encoding='utf-8')
          assert source.count('class="nuvio-home-scroll"')==1
          assert source.count('class="nuvio-scroll-start"')==2
          assert 'this._nuvioHomeScrollTop=oldHomeScroller.scrollTop;' in source
          print('PASS: Nuvio Home and expanded catalogs have bounded internal scroll and fixed back-to-beginning controls')
          print('PASS: Home and expanded catalog positions survive UI re-renders')
          PY
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          echo 'PASS: Nuvio JavaScript syntax and integration manifest validation'
      - name: Commit and release v0.4.90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/manifest.json custom_components/nuvio/frontend/nuvio-card.js
          git commit -m 'feat: bounded Nuvio catalog scrolling and return to beginning (v0.4.90)'
          git push origin HEAD:main
          gh release create v0.4.90 --target "$(git rev-parse HEAD)" --title v0.4.90 --notes 'Contain vertical scrolling inside the Nuvio Home catalog and expanded catalogs; provide back-to-beginning controls while preserving catalog position on re-renders.'
