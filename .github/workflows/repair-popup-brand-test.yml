name: Validate and apply Nuvio popup branding

on:
  push:
    branches:
      - feature/popup-logo-default
    paths:
      - .github/workflows/repair-popup-brand-test.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply popup branding and adjust simulated DOM assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow=Path('.github/workflows/apply-popup-brand-default.yml').read_text(encoding='utf-8')
          anchor="          python - <<'PY'\n"
          assert workflow.count(anchor)>=1
          code=workflow.split(anchor,1)[1].split('          PY\n',1)[0]
          exec(dedent(code), {'__name__':'__main__'})
          tests_path=Path('tests/test_card.cjs')
          tests=tests_path.read_text(encoding='utf-8')
          start=tests.index("const launcherEditor=window.document.createElement('nuvio-popup-card-editor');")
          closing='launcher.remove();launcherEditor.remove();'
          end=tests.index(closing,start)+len(closing)
          tests=tests[:start]+'''// linkedom's select.value is read-only; verify editor UI statically and
          // exercise config-changed preservation without its incomplete select mock.
          assert.match(cardSource,/Button icon \\(MDI, optional\\)/);
          assert.match(cardSource,/Leave empty to use the official Nuvio logo/);
          const launcherEditor=window.document.createElement('nuvio-popup-card-editor');
          const popupEdits=[];
          launcherEditor.addEventListener('config-changed',event=>popupEdits.push(event.detail.config));
          launcherEditor.emit({type:'custom:nuvio-popup-card',button_label:'Nuvio',other_setting:'keep-me',button_icon:'mdi:movie-open'});
          assert.equal(popupEdits.at(-1).button_icon,'mdi:movie-open');
          assert.equal(popupEdits.at(-1).other_setting,'keep-me');
          launcherEditor.emit({...popupEdits.at(-1),button_icon:''});
          assert.equal(popupEdits.at(-1).button_icon,'');
          launcher.remove();launcherEditor.remove();'''+tests[end:]
          tests_path.write_text(tests,encoding='utf-8')
          PY
      - name: Validate syntax and existing regression suite
        run: |
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
          python - <<'PY'
          from pathlib import Path
          source=Path('custom_components/nuvio/frontend/nuvio-popup-card.js').read_text(encoding='utf-8')
          bundle=Path('custom_components/nuvio/frontend/nuvio-card.js').read_text(encoding='utf-8')
          assert bundle.endswith(source)
          assert 'NUVIO-CARD v0.4.71' in bundle
          assert '<span class="card-version">v0.4.71</span>' in bundle
          assert 'popupSize()' in source and 'popup_width' in source
          assert 'https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp' in source
          assert 'input.addEventListener("change", () => this.emit({...this._config,[field]:input.value}));' in source
          print('PASS: official default logo, icon override and clearing, editor, popup sizing, bundled resource, v0.4.71')
          PY
      - name: Commit implemented feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json docs/popup-card.md tests/test_card.cjs
          git commit -m "Default Nuvio popup button to official logo (v0.4.71)"
          git push origin HEAD:feature/popup-logo-default
