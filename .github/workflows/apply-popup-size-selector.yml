name: Apply Nuvio popup size selector

on:
  push:
    branches:
      - feature/nuvio-popup-size-selector
    paths:
      - .github/workflows/apply-popup-size-selector.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add popup size presets and editor selector
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/nuvio')
          popup_path = root / 'frontend/nuvio-popup-card.js'
          source = popup_path.read_text(encoding='utf-8')
          def patch(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              source = source.replace(old, new, 1)
          patch('static getStubConfig() { return {button_label: "Nuvio", button_icon: "mdi:television-play"}; }',
                'static getStubConfig() { return {button_label: "Nuvio", button_icon: "mdi:television-play", popup_width: "wide"}; }', 'stub default')
          patch('  getCardSize() { return 1; }',
                '  getCardSize() { return 1; }\n  popupSize() { return ["normal", "wide", "fullscreen"].includes(this._config.popup_width) ? this._config.popup_width : "wide"; }', 'size normalization')
          patch('    this._config = {...config};\n    this.render();\n    if (this._popupCard)',
                '    this._config = {...config};\n    this.render();\n    if (this._overlay) this._overlay.dataset.size = this.popupSize();\n    if (this._popupCard)', 'live config update')
          patch('    overlay.className = "nuvio-popup-overlay";',
                '    overlay.className = "nuvio-popup-overlay";\n    overlay.dataset.size = this.popupSize();', 'apply size to overlay')
          patch('.nuvio-popup-frame{width:min(1200px,100%);height:min(900px,100%);min-width:0;',
                '.nuvio-popup-frame{width:min(1180px,96vw);max-width:96vw;height:min(1050px,92dvh);max-height:92dvh;min-width:0;', 'wide size')
          patch('      .nuvio-popup-top{height:48px;',
                '      .nuvio-popup-overlay[data-size="normal"] .nuvio-popup-frame{width:min(850px,96vw)}\n      .nuvio-popup-overlay[data-size="fullscreen"]{padding:0}\n      .nuvio-popup-overlay[data-size="fullscreen"] .nuvio-popup-frame{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}\n      .nuvio-popup-top{height:48px;', 'normal and fullscreen sizes')
          patch('button{width:36px;height:36px;display:grid;place-items:center;border:0;',
                'button{width:36px;height:36px;display:grid;place-items:center;border:0;', 'no-op guard') if False else None
          patch('<label>Button icon (MDI)<input data-field="button_icon" type="text" placeholder="mdi:television-play"></label></div><nuvio-card-editor>',
                '<label>Button icon (MDI)<input data-field="button_icon" type="text" placeholder="mdi:television-play"></label><label>Popup size<select data-field="popup_width"><option value="normal">Normal</option><option value="wide">Wide</option><option value="fullscreen">Full screen</option></select></label></div><nuvio-card-editor>', 'visual editor dropdown')
          patch('    const editor=this.shadowRoot.querySelector("nuvio-card-editor");\n    editor.addEventListener',
                '    const popupSize=this.shadowRoot.querySelector("select[data-field=popup_width]");\n    popupSize.value=["normal","wide","fullscreen"].includes(this._config.popup_width)?this._config.popup_width:"wide";\n    popupSize.addEventListener("change",()=>this.emit({...this._config,popup_width:popupSize.value}));\n    const editor=this.shadowRoot.querySelector("nuvio-card-editor");\n    editor.addEventListener', 'visual editor state and change event')
          popup_path.write_text(source, encoding='utf-8')
          bundled_path = root / 'frontend/nuvio-card.js'
          bundled = bundled_path.read_text(encoding='utf-8')
          marker = '// Nuvio popup button. Bundled after nuvio-card.js'
          if bundled.count(marker) != 1:
              raise SystemExit('Expected one Nuvio popup bundle marker')
          full, previous_popup = bundled.split(marker, 1)
          if 'NUVIO-CARD v0.4.68' not in full:
              raise SystemExit('Unexpected bundled full card version')
          full = full.replace('v0.4.68', 'v0.4.69')
          bundled_path.write_text(full.rstrip() + '\n\n' + source, encoding='utf-8')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '0.4.68':
              raise SystemExit('Unexpected manifest version')
          manifest['version'] = '0.4.69'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          docs_path = Path('docs/popup-card.md')
          docs = docs_path.read_text(encoding='utf-8')
          anchor = 'button_icon: mdi:television-play\n'
          if docs.count(anchor) != 1:
              raise SystemExit('Unexpected popup docs sample')
          docs = docs.replace(anchor, anchor + 'popup_width: wide  # normal, wide, or fullscreen\n', 1)
          docs += '\nPopup size: select **Normal** (up to 850 px), **Wide** (default, up to 1180 px), or **Full screen** in the popup card visual editor. The YAML key is `popup_width`. On narrow/mobile displays, the popup fills the viewport regardless of the selected preset. This changes the dialog dimensions only; existing Nuvio player/room/HDMI options continue to work.\n'
          docs_path.write_text(docs, encoding='utf-8')
          PY
      - name: Validate popup size selector and existing card
        shell: bash
        run: |
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
          python - <<'PY'
          from pathlib import Path
          source = Path('custom_components/nuvio/frontend/nuvio-popup-card.js').read_text()
          bundle = Path('custom_components/nuvio/frontend/nuvio-card.js').read_text()
          for option in ('normal','wide','fullscreen'):
              assert f'<option value="{option}">' in source
          assert 'popupSize.value=' in source
          assert 'popup_width:popupSize.value' in source
          assert 'dataset.size = this.popupSize()' in source
          assert '[data-size="normal"] .nuvio-popup-frame' in source
          assert '[data-size="fullscreen"] .nuvio-popup-frame' in source
          assert bundle.endswith(source)
          assert 'NUVIO-CARD v0.4.69' in bundle
          print('Popup size preset registration, editor, CSS, bundle, and version checks passed')
          PY
      - name: Commit updated frontend and version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json docs/popup-card.md
          git commit -m "Add Nuvio popup size selector (v0.4.69)"
          git push origin HEAD:feature/nuvio-popup-size-selector