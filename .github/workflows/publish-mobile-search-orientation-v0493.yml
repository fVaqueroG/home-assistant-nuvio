name: Publish Nuvio mobile search and orientation v0.4.93
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-mobile-search-orientation-v0493.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch mobile search
        run: python3 .github/scripts/fix-mobile-search-v0493.py
      - name: Match portrait and landscape layouts
        run: python3 .github/scripts/consistent-mobile-orientation-v0493.py
      - name: Validate JavaScript and version
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json > /dev/null
          echo 'PASS: main and popup JavaScript syntax and integration manifest'
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/manifest.json
          git commit -m 'fix: mobile search and consistent portrait landscape layout (v0.4.93)'
          git push origin HEAD:main
          gh release create v0.4.93 --target "$(git rev-parse HEAD)" --title v0.4.93 --notes 'Add a touch-friendly Search button and mobile keyboard search action. Use the same Nuvio mobile layout and fullscreen popup in portrait and landscape, retaining existing navigation.'
