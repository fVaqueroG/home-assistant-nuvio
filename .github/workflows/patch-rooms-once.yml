name: Apply Nuvio room mappings and remote volume (one-time)
on:
  push:
    branches:
      - feature/room-mappings-volume-control
permissions:
  contents: write
concurrency:
  group: apply-nuvio-rooms
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Nuvio card and room regression patches
        run: |
          python3 .github/scripts/patch_rooms_once.py
          python3 .github/scripts/rooms_regression_once.py
      - name: Syntax check
        run: node --check custom_components/nuvio/frontend/nuvio-card.js
      - name: Card regression tests
        run: |
          npm ci --prefix tests
          node tests/test_card.cjs
      - name: Validate patch and commit source only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json tests/test_card.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Test Nuvio room selection, HDMI routing, power helpers and volume control'
            git push
          fi
