name: Apply HDMI display routing
on:
  push:
    branches:
      - release/0.4.60-hdmi-input-routing
    paths:
      - .github/workflows/nuvio-display-routing-repair.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.60-hdmi-input-routing
      - name: Add configurable display routes to Nuvio card
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('custom_components/nuvio/frontend/nuvio-card.js')
          s=path.read_text()
          def replace_once(before,after):
              global s
              assert s.count(before)==1, ('anchor',before[:85],s.count(before))
              s=s.replace(before,after,1)
          anchor='  async loadHome(refresh=false,retry=false){'
          routing='''  displayRoute(player){
            var routes=Array.isArray(this._config.display_routes)?this._config.display_routes:[];
            return routes.find(r=>r&&r.player===player&&typeof r.display==="string"&&r.display.startsWith("media_player.")&&String(r.source||"").trim())||null;
          }
          async ensureDisplaySource(player){
            var route=this.displayRoute(player);
            if(!route)return;
            var display=route.display,source=String(route.source).trim();
            if(!this._hass||!this._hass.states||!this._hass.states[display])throw new Error("Display "+display+" is not available in Home Assistant.");
            var state=this._hass.states[display];
            if(state.state==="unavailable"||state.state==="unknown")throw new Error("Display "+display+" is "+state.state+".");
            var pending=this._displayRoutePending;
            if(pending&&pending.player===player&&pending.display===display&&pending.source===source)return pending.promise;
            var task=(async()=>{
              if(state.state==="off"&&route.turn_on!==false){
                await this._hass.callService("media_player","turn_on",{},{entity_id:display});
                var wakeDelay=Math.max(0,Math.min(10000,Number(route.wake_delay_ms??2000)||0));
                if(wakeDelay)await new Promise(resolve=>setTimeout(resolve,wakeDelay));
              }
              if(((this._hass.states[display]||{}).attributes||{}).source===source)return;
              var recent=this._lastDisplaySwitch;
              if(recent&&recent.player===player&&recent.display===display&&recent.source===source&&Date.now()-recent.time<2000)return;
              await this._hass.callService("media_player","select_source",{source:source},{entity_id:display});
              this._lastDisplaySwitch={player,display,source,time:Date.now()};
              var settle=Math.max(0,Math.min(10000,Number(route.delay_ms??1000)||0));
              if(settle)await new Promise(resolve=>setTimeout(resolve,settle));
            })();
            this._displayRoutePending={player,display,source,promise:task};
            try{await task;}
            finally{if(this._displayRoutePending&&this._displayRoutePending.promise===task)this._displayRoutePending=null;}
          }
          async choosePlayer(player){
            this._playerId=player;
            try{await this.ensureDisplaySource(player);}
            catch(e){this._error="Could not switch TV input: "+(e.message||e);this.render();}
            finally{if(this._view==="details")this.render();}
          }
          '''
          replace_once(anchor,routing+anchor)
          replace_once('      if(openOnly)await this._hass.callService("nuvio","open",','      await this.ensureDisplaySource(p);\n      if(openOnly)await this._hass.callService("nuvio","open",')
          replace_once('        "play_source",\n        this.sourcePlaybackData(stream,inNuvio),','        "play_source",\n        this.sourcePlaybackData(stream,inNuvio),')
          replace_once('    try{\n      await this._hass.callService(\n        "nuvio",\n        "play_source",','    try{\n      await this.ensureDisplaySource(p);\n      await this._hass.callService(\n        "nuvio",\n        "play_source",')
          replace_once('    var context=this.playData(this._streamContext||null);\n    try{\n      await this._hass.callService(','    var context=this.playData(this._streamContext||null);\n    try{\n      await this.ensureDisplaySource(p);\n      await this._hass.callService(')
          replace_once('    try{\n      await this._hass.callService("nuvio","remote_key",{key:key},{entity_id:p});','    try{\n      await this.ensureDisplaySource(p);\n      await this._hass.callService("nuvio","remote_key",{key:key},{entity_id:p});')
          replace_once('r.querySelector("#player")?.addEventListener("change",e=>{this._playerId=e.target.value;if(this._view==="details")this.render();});','r.querySelector("#player")?.addEventListener("change",e=>{this.choosePlayer(e.target.value);});')
          assert s.count('v0.4.59')==2
          s=s.replace('v0.4.59','v0.4.60')
          path.write_text(s)
          manifest=Path('custom_components/nuvio/manifest.json')
          m=manifest.read_text()
          assert m.count('"version": "0.4.59"')==1
          manifest.write_text(m.replace('"version": "0.4.59"','"version": "0.4.60"',1))
          readme=Path('README.md');r=readme.read_text()
          anchor='## Actions\n'
          assert r.count(anchor)==1
          section='''### Automatically switch the physical TV to a playback device

          When an Android TV box (or another player) is connected to a separate LG webOS,
          Roku TV, or other Home Assistant TV, configure `display_routes` on the Nuvio
          Lovelace card in **Edit dashboard → Edit card → Show code editor**:

          ```yaml
          type: custom:nuvio-card
          default_player: media_player.android_box
          display_routes:
            - player: media_player.android_box
              display: media_player.lg_webos_tv
              source: HDMI 1
              turn_on: true
              delay_ms: 1000
            - player: media_player.bedroom_android_box
              display: media_player.bedroom_roku_tv
              source: HDMI 2
          ```

          Replace the example entity IDs with the actual playback and physical TV entities.
          Use the **exact** HDMI input name from the physical TV's `source_list` attribute
          in Home Assistant Developer Tools → States. Select a mapped player in the card
          or press Play to turn on the display if needed, switch to its source, then send
          playback to the selected player. `turn_on: false` skips display power-on;
          `wake_delay_ms` (default 2000) waits after waking the TV, and `delay_ms`
          (default 1000) waits after switching its source. Unmapped players are unchanged.
          The display must implement `media_player.select_source` in Home Assistant.

          '''
          readme.write_text(r.replace(anchor,section+anchor,1))
          tests=Path('tests/test_card.cjs');t=tests.read_text()
          anchor="(async()=>{\n const card=window.document.createElement('nuvio-card');"
          assert t.count(anchor)==1
          snippet='''(async()=>{
           // Route HDMI first while preserving the selected Nuvio playback entity.
           const routed=window.document.createElement('nuvio-card');
           routed.setConfig({show_remote:false,display_routes:[{player:'media_player.android_box',display:'media_player.lg_tv',source:'HDMI 2',wake_delay_ms:0,delay_ms:0}]});
           routed._playerId='media_player.android_box';routed._item={id:'tt1',type:'movie',name:'Movie'};
           const routedCalls=[],display={state:'on',attributes:{source:'HDMI 1'}};
           routed._hass={states:{'media_player.lg_tv':display,'media_player.android_box':{}},callService:async(...args)=>routedCalls.push(args)};
           await routed.play(false,null);
           assert.deepEqual(routedCalls.map(x=>x[0]+'.'+x[1]),['media_player.select_source','nuvio.play']);
           assert.equal(routedCalls[0][2].source,'HDMI 2');
           assert.equal(routedCalls[0][3].entity_id,'media_player.lg_tv');
           assert.equal(routedCalls[1][3].entity_id,'media_player.android_box');
           routedCalls.length=0;routed._playerId='media_player.no_route';
           await routed.play(false,null);
           assert.equal(routedCalls.length,1);assert.equal(routedCalls[0][1],'play');
           routed._playerId='media_player.android_box';routed._lastDisplaySwitch=null;
           display.attributes.source='HDMI 2';routedCalls.length=0;
           await routed.play(false,null);
           assert.deepEqual(routedCalls.map(x=>x[1]),['play']);
           display.state='off';display.attributes.source='HDMI 1';routed._lastDisplaySwitch=null;routedCalls.length=0;
           await routed.play(false,null);
           assert.deepEqual(routedCalls.map(x=>x[1]),['turn_on','select_source','play']);
           routed.remove();
           const card=window.document.createElement('nuvio-card');'''
          tests.write_text(t.replace(anchor,snippet,1))
          print('HDMI routing implementation and regression tests staged')
          PY
      - name: Validate JavaScript, card tests, and integration
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
          python -m compileall -q custom_components/nuvio
      - name: Commit changed application files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json README.md tests/test_card.cjs
          git commit -m 'Release 0.4.60: route playback devices to physical TV inputs'
          git push origin HEAD:release/0.4.60-hdmi-input-routing
