name: Publish Nuvio banner Beginning beside Control v0.4.92
on:
  push:
    branches: [main]
    paths: ['.github/workflows/beginning-next-to-control-v0492.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Relocate Beginning to main header
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('custom_components/nuvio/frontend/nuvio-card.js')
          s=p.read_text(encoding='utf-8')
          def change(old,new,label):
              global s
              count=s.count(old)
              if count!=1:raise RuntimeError(f'{label}: expected one match, found {count}')
              s=s.replace(old,new,1)
          change('var beginning=this._view==="sources"', 'var beginning=["home","catalog","sources"].includes(this._view)', 'show Beginning in eligible views')
          change('addons+beginning+remote+\'</div></div>\';', 'addons+\'<div class="nuvio-header-nav">\'+beginning+remote+\'</div></div>\';', 'group Beginning with Control in banner')
          change('if(this._view==="home")body=\'<div class="nuvio-home-toolbar"><button type="button" class="nuvio-scroll-start" title="Back to beginning" aria-label="Back to beginning">↑ Beginning</button></div><div class="nuvio-home-scroll">\'+body+\'</div>\';', 'if(this._view==="home")body=\'<div class="nuvio-home-scroll">\'+body+\'</div>\';', 'remove previous home toolbar')
          change('<div class="nuvio-catalog-quick-nav"><button type="button" class="nuvio-scroll-start" title="Back to beginning" aria-label="Back to beginning">↑ Beginning</button></div>', '', 'remove old catalog toolbar')
          change('.nuvio-scroll-start[hidden],', '.nuvio-header-nav{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto;flex:0 0 auto}.nuvio-scroll-start[hidden],', 'keep navigation beside Control at bottom right of wrapping header')
          change('v0.4.91</span>', 'v0.4.92</span>', 'displayed version')
          p.write_text(s,encoding='utf-8')
          m=Path('custom_components/nuvio/manifest.json')
          manifest=json.loads(m.read_text(encoding='utf-8'))
          if manifest['version']!='0.4.91':raise RuntimeError('Unexpected Nuvio version')
          manifest['version']='0.4.92'
          m.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          echo 'PASS: Nuvio Beginning beside Control and JavaScript syntax'
      - name: Commit and publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json
          git commit -m 'feat: place contextual Nuvio Beginning beside Control in header (v0.4.92)'
          git push origin HEAD:main
          gh release create v0.4.92 --target "$(git rev-parse HEAD)" --title v0.4.92 --notes 'Move the conditional Beginning button from the separate Home/Catalog toolbars into the main header directly beside the Control button, kept together on wrapped layouts; preserve the Sources Beginning navigation.'
