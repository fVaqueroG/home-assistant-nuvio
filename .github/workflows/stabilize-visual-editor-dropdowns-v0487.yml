name: Stabilize Nuvio visual editor dropdowns v0.4.87
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-visual-editor-dropdowns-v0487.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve visual editor dropdowns
        run: python3 .github/scripts/stabilize_visual_editor_dropdowns_v0487.py
      - name: Validate JavaScript and manifest
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python3 -m json.tool custom_components/nuvio/manifest.json >/dev/null
          grep -q 'NUVIO-CARD v0.4.87' custom_components/nuvio/frontend/nuvio-card.js
      - name: Commit validated update and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stabilize-visual-editor-dropdowns-v0487.yml .github/scripts/stabilize_visual_editor_dropdowns_v0487.py
          git add custom_components/nuvio
          git commit -m 'v0.4.87: preserve visual editor dropdowns during HA updates'
          git push origin HEAD:main
          gh release create v0.4.87 --target "$(git rev-parse HEAD)" --title v0.4.87 --notes 'Keep Nuvio visual configuration dropdowns open during Home Assistant state and configuration updates. Normal popup closing behavior is unchanged.'