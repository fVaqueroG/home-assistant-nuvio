name: Apply Continue Watching metadata fix (one-time)
on:
  push:
    branches:
      - fix/continue-watching-metadata-titles
permissions:
  contents: write
concurrency:
  group: patch-nuvio-cw-metadata
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend and TMDB title lookup patch
        run: python3 .github/scripts/patch_cw_once.py
      - name: Python syntax and metadata regression tests
        run: |
          python3 -m compileall -q custom_components/nuvio
          python3 tests/test_continue_titles.py
      - name: Card syntax and existing regression tests
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
      - name: Commit patch and remove temporary workflow
        run: |
          git diff --check
          git rm -f .github/workflows/patch-cw-once.yml .github/scripts/patch_cw_once.py
          git add custom_components/nuvio/frontend.py custom_components/nuvio/cw_metadata.py custom_components/nuvio/tmdb.py custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json tests/test_continue_titles.py .github/workflows/release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve Continue Watching IMDb IDs to movie and show titles'
          git push
