name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/nuvio/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/nuvio/manifest.json").read_text())
          print(manifest["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate bundled card version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          grep -F "NUVIO-CARD v$VERSION" custom_components/nuvio/frontend/nuvio-card.js
          grep -F '<span class="card-version">v'"$VERSION"'</span>' custom_components/nuvio/frontend/nuvio-card.js
          python - <<'PY'
          from pathlib import Path
          source = Path("custom_components/nuvio/frontend.py").read_text()
          if 'CARD_VERSION = "' in source:
              raise SystemExit("frontend.py must derive CARD_VERSION from manifest.json")
          if 'MANIFEST_FILE.read_text' not in source:
              raise SystemExit("frontend.py is not deriving the card cache version from manifest.json")
          PY

      - name: Compile Python integration
        shell: bash
        run: python -m compileall -q custom_components/nuvio

      - name: Check provider launcher names
        shell: bash
        run: |
          python -m pip install -q pyflakes
          pyflakes custom_components/nuvio/config_flow.py custom_components/nuvio/frontend.py custom_components/nuvio/launcher.py custom_components/nuvio/providers.py custom_components/nuvio/tmdb.py custom_components/nuvio/tvdb.py custom_components/nuvio/justwatch.py

      - name: Check Lovelace card syntax
        shell: bash
        run: node --check custom_components/nuvio/frontend/nuvio-card.js

      - name: Run Lovelace card regression tests
        shell: bash
        run: |
          npm ci --prefix tests
          node tests/test_card.cjs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
