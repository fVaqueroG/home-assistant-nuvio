name: Apply Nuvio toolbar change (one-time)
on:
  push:
    branches:
      - release/0.4.59-toolbar-player
    paths:
      - .github/workflows/nuvio-toolbar-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.59-toolbar-player
      - name: Correct toolbar migration anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_toolbar_once.py')
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          for term, replacement in (
              ("'Sources player duplication'", '''swap("this.playerSelect()+debridControls", "debridControls", 'Sources player duplication')\n'''),
              ("'Top toolbar player'", '''swap("+search+", "+search+this.playerSelect()+", 'Top toolbar player')\n'''),
          ):
              matches = [i for i, line in enumerate(lines) if term in line]
              assert len(matches) == 1, term
              lines[matches[0]] = replacement
          s = ''.join(lines)
          old = "for text in ('Home', 'Refresh', 'Control', 'Addons'):\n    swap('<span>'+text+'</span></button>', '</button>', text+' icon-only button')\n"
          new = '''header_start=c.index('  header(){')
          header_end=c.index('  async goHome(){',header_start)
          header=c[header_start:header_end]
          for text in ('Home', 'Refresh', 'Control', 'Addons'):
              marker='<span>'+text+'</span></button>'
              assert header.count(marker)==1, text+' header icon-only marker'
              header=header.replace(marker,'</button>',1)
          c=c[:header_start]+header+c[header_end:]
          '''
          assert s.count(old) == 1
          s = s.replace(old,new,1)
          lines=s.splitlines(keepends=True)
          tests=[i for i,line in enumerate(lines) if 'assert.doesNotMatch(cardSource,/<span>(?:Home|Refresh|Control|Addons)' in line]
          assert len(tests)==1
          lines[tests[0]]='assert.match(cardSource,/id="homeTop"/);\n'
          p.write_text(''.join(lines))
          PY
      - name: Apply toolbar patch
        run: python tools/apply_toolbar_once.py
      - name: Wrap player in a styled top-toolbar control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/nuvio/frontend/nuvio-card.js')
          s=p.read_text()
          old="'+search+this.playerSelect()+"
          new=''''+search+'<label class="toolbar-player" title="Select media player"><ha-icon icon="mdi:television" aria-hidden="true"></ha-icon>'+this.playerSelect()+'</label>'+'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate card and tests
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.4.59: sticky toolbar with shared player selector and icon controls'
          git push origin HEAD:release/0.4.59-toolbar-player
