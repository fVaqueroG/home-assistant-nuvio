name: Apply Nuvio popup logo default

on:
  push:
    branches:
      - feature/popup-logo-default
    paths:
      - .github/workflows/apply-popup-brand-default.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Implement default logo and opt-in icon
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/nuvio')
          popup_path = root / 'frontend/nuvio-popup-card.js'
          source = popup_path.read_text(encoding='utf-8')
          old_stub = 'static getStubConfig() { return {button_label: "Nuvio", button_icon: "mdi:television-play", popup_width: "wide"}; }'
          new_stub = 'static getStubConfig() { return {button_label: "Nuvio", popup_width: "wide"}; }'
          assert source.count(old_stub) == 1, 'Unexpected popup stub config'
          source = source.replace(old_stub, new_stub, 1)
          render_start = source.index('  render() {\n    const label = String(this._config.button_label ?? "Nuvio");')
          render_end = source.index('  openPopup() {', render_start)
          new_render = '''  render() {
              const label = String(this._config.button_label ?? "Nuvio");
              // A non-empty saved icon is an explicit user selection. Blank or
              // absent icon uses the official wordmark, including in old cards.
              const icon = String(this._config.button_icon ?? "").trim();
              const selectedIcon = icon.length > 0;
              this.shadowRoot.innerHTML = `<style>
                :host{display:block}ha-card{height:56px;box-sizing:border-box}
                button{box-sizing:border-box;width:100%;height:100%;border:0;border-radius:var(--ha-card-border-radius,12px);padding:0 12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:transparent;color:var(--primary-text-color);font:inherit;font-weight:600}
                button:hover{background:var(--secondary-background-color)}button:focus-visible{outline:2px solid var(--primary-color);outline-offset:-3px}
                ha-icon{color:var(--primary-color);--mdc-icon-size:25px}
                .launcher-visual{min-width:0;display:flex;align-items:center;justify-content:center}
                .launcher-logo{display:block;width:120px;max-width:100%;height:auto;max-height:38px;object-fit:contain}
                .launcher-caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              </style><ha-card><button type="button" aria-label="Open Nuvio"><span class="launcher-visual"></span><span class="launcher-caption"></span></button></ha-card>`;
              const visual = this.shadowRoot.querySelector(".launcher-visual");
              if (selectedIcon) {
                const selected = document.createElement("ha-icon");
                selected.setAttribute("icon", icon);
                visual.appendChild(selected);
              } else {
                const logo = document.createElement("img");
                logo.className = "launcher-logo";
                logo.src = "https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp";
                logo.alt = "";
                logo.addEventListener("error", () => {
                  const fallback = document.createElement("strong");
                  fallback.textContent = "Nuvio";
                  logo.replaceWith(fallback);
                });
                visual.appendChild(logo);
              }
              const caption = this.shadowRoot.querySelector(".launcher-caption");
              caption.textContent = label;
              // The wordmark already says Nuvio; avoid doubling the brand text.
              caption.style.display = selectedIcon || (label.trim() && label.trim().toLowerCase() !== "nuvio") ? "" : "none";
              this.shadowRoot.querySelector("button").addEventListener("click", () => this.openPopup());
            }
          '''
          source = source[:render_start] + new_render + source[render_end:]
          old_icon = '<label>Button icon (MDI)<input data-field="button_icon" type="text" placeholder="mdi:television-play"></label>'
          new_icon = '<label>Button icon (MDI, optional)<input data-field="button_icon" type="text" placeholder="Leave blank for Nuvio logo"><small>Leave empty to use the official Nuvio logo.</small></label>'
          assert source.count(old_icon) == 1, 'Unexpected popup editor icon field'
          source = source.replace(old_icon, new_icon, 1)
          old_default = 'input.value=String(this._config[field] ?? (field==="button_label"?"Nuvio":"mdi:television-play"));'
          new_default = 'input.value=String(this._config[field] ?? (field==="button_label"?"Nuvio":""));'
          assert source.count(old_default) == 1, 'Unexpected editor icon default'
          source = source.replace(old_default, new_default, 1)
          popup_path.write_text(source, encoding='utf-8')

          bundle_path = root / 'frontend/nuvio-card.js'
          bundle = bundle_path.read_text(encoding='utf-8')
          marker = '// Nuvio popup button. Bundled after nuvio-card.js'
          assert bundle.count(marker) == 1, 'Missing or duplicate popup bundle marker'
          full, _old_popup = bundle.split(marker, 1)
          assert full.count('NUVIO-CARD v0.4.70') == 1, 'Unexpected old bundle version'
          assert full.count('<span class="card-version">v0.4.70</span>') == 1, 'Unexpected old displayed card version'
          full = full.replace('v0.4.70', 'v0.4.71')
          bundle_path.write_text(full.rstrip() + '\n\n' + source, encoding='utf-8')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '0.4.70', 'Unexpected integration version'
          manifest['version'] = '0.4.71'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          docs_path = Path('docs/popup-card.md')
          docs = docs_path.read_text(encoding='utf-8')
          assert docs.count('button_icon: mdi:television-play\n') == 1
          docs = docs.replace('button_icon: mdi:television-play\n', '# button_icon: mdi:television-play  # Optional: use this icon instead of the logo\n', 1)
          docs += '\nBy default, the compact popup button displays the official Nuvio wordmark. Leave `button_icon` absent or empty to show the logo. Set `button_icon: mdi:television-play` (or another Home Assistant icon) to replace the logo with that icon. Clear the icon field in the visual editor to return to the logo. Existing saved cards with an explicit icon keep their chosen icon; remove `button_icon` to switch to the logo. When the logo appears with the default Nuvio label, the duplicate label is hidden; a custom label is still shown. If the remote image fails to load, the button falls back to the word Nuvio.\n'
          docs_path.write_text(docs, encoding='utf-8')

          tests_path = Path('tests/test_card.cjs')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '// Home Assistant discovers the native visual editor and preserves unrelated YAML.\n'
          assert tests.count(anchor) == 1, 'Missing stable test insertion point'
          popup_tests = '''// Popup launcher: official logo by default, explicit icon overrides it.
          const launcher=window.document.createElement('nuvio-popup-card');
          assert.equal(launcher.constructor.getStubConfig().button_icon,undefined);
          launcher.setConfig({type:'custom:nuvio-popup-card',button_label:'Nuvio',popup_width:'wide'});
          assert.equal(launcher.shadowRoot.querySelector('.launcher-logo').getAttribute('src'),'https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon'),null);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-caption').style.display,'none');
          launcher.setConfig({type:'custom:nuvio-popup-card',button_icon:'mdi:television-play',button_label:'Nuvio'});
          assert.equal(launcher.shadowRoot.querySelector('.launcher-logo'),null);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon').getAttribute('icon'),'mdi:television-play');
          assert.notEqual(launcher.shadowRoot.querySelector('.launcher-caption').style.display,'none');
          launcher.setConfig({type:'custom:nuvio-popup-card',button_icon:'',button_label:'Movies'});
          assert.ok(launcher.shadowRoot.querySelector('.launcher-logo'));
          assert.equal(launcher.shadowRoot.querySelector('.launcher-caption').textContent,'Movies');
          const launcherEditor=window.document.createElement('nuvio-popup-card-editor');
          launcherEditor.setConfig({type:'custom:nuvio-popup-card',button_label:'Nuvio',other_setting:'keep-me'});
          const iconField=launcherEditor.shadowRoot.querySelector('[data-field="button_icon"]');
          assert.equal(iconField.value,'');
          const popupEdits=[];
          launcherEditor.addEventListener('config-changed',event=>popupEdits.push(event.detail.config));
          iconField.value='mdi:movie-open';iconField.dispatchEvent(new window.Event('change',{bubbles:true}));
          assert.equal(popupEdits.at(-1).button_icon,'mdi:movie-open');
          assert.equal(popupEdits.at(-1).other_setting,'keep-me');
          const clearIcon=launcherEditor.shadowRoot.querySelector('[data-field="button_icon"]');
          clearIcon.value='';clearIcon.dispatchEvent(new window.Event('change',{bubbles:true}));
          assert.equal(popupEdits.at(-1).button_icon,'');
          launcher.remove();launcherEditor.remove();
          '''
          tests = tests.replace(anchor, popup_tests + anchor, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate frontend, logo override, integration and regression tests
        shell: bash
        run: |
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          node --check custom_components/nuvio/frontend/nuvio-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
          python - <<'PY'
          from pathlib import Path
          source=Path('custom_components/nuvio/frontend/nuvio-popup-card.js').read_text(encoding='utf-8')
          bundle=Path('custom_components/nuvio/frontend/nuvio-card.js').read_text(encoding='utf-8')
          assert bundle.endswith(source)
          assert 'NUVIO-CARD v0.4.71' in bundle
          assert '<span class="card-version">v0.4.71</span>' in bundle
          assert 'popupSize()' in source and 'popup_width' in source
          assert 'https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp' in source
          print('PASS: logo default, selected icon override, editor save/clear, popup sizing, bundled resource and version')
          PY
      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/manifest.json docs/popup-card.md tests/test_card.cjs
          git commit -m "Default Nuvio popup launcher to official wordmark (v0.4.71)"
          git push origin HEAD:feature/popup-logo-default
