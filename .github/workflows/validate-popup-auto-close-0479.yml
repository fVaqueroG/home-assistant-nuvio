name: Validate popup auto-close v0.4.79
on:
  push:
    branches:
      - feature/popup-auto-close-0479
    paths:
      - .github/workflows/validate-popup-auto-close-0479.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply popup auto-close changes
        shell: bash
        run: |
          python .github/scripts/apply-popup-auto-close-0479.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/manifest.json custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/nuvio-card.js tests/test_card.cjs docs/popup-card.md
          git commit -m 'Add configurable popup auto-close (v0.4.79)'
          git push
      - name: Validate syntax, regression tests, version
        shell: bash
        run: |
          python -m compileall -q custom_components/nuvio
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          npm ci --prefix tests
          node tests/test_card.cjs
          grep -F 'NUVIO-CARD v0.4.79' custom_components/nuvio/frontend/nuvio-card.js
          git diff --exit-code
