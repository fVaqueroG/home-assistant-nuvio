name: Apply official NuvioTV dev branding
on:
  push:
    branches:
      - feature/official-nuvio-dev-brand-assets-0475
    paths:
      - .github/workflows/apply-nuvio-dev-brand-assets.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle upstream NuvioTV dev assets and update local routes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen

          old, new = '0.4.74', '0.4.75'
          assets = Path('custom_components/nuvio/frontend/assets')
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\x00' + data).hexdigest()
          # Fetch the official dev-branch PNG once at build time, never in a user's browser.
          url = 'https://raw.githubusercontent.com/NuvioMedia/NuvioTV/dev/assets/brand/app_logo_wordmark.png'
          with urlopen(Request(url, headers={'User-Agent': 'Nuvio-HomeAssistant-brand-assets'}), timeout=30) as response:
              wordmark = response.read()
          assert wordmark.startswith(b'\x89PNG\r\n\x1a\n'), 'Official wordmark is not PNG'
          assert blob_sha(wordmark) == '7c05994ee6f3ff8b2d21310645fe33db28b1ef61', 'Official dev wordmark changed unexpectedly'
          # This existing local file already exactly matches the official dev app_logo_mark.png.
          mark = (assets / 'mark.png').read_bytes()
          assert mark.startswith(b'\x89PNG\r\n\x1a\n')
          assert blob_sha(mark) == '9fc0d4ade566f9e7c836ab59e107a320f1b98976', 'Bundled logo mark differs from official dev image'
          (assets / 'wordmark.png').write_bytes(wordmark)
          (assets / 'wordmark.webp').unlink()

          frontend = Path('custom_components/nuvio/frontend.py')
          content = frontend.read_text(encoding='utf-8')
          assert content.count('wordmark.webp') == 2
          frontend.write_text(content.replace('wordmark.webp', 'wordmark.png'), encoding='utf-8')

          for filename in ('nuvio-card.js', 'nuvio-popup-card.js'):
              path = Path('custom_components/nuvio/frontend') / filename
              content = path.read_text(encoding='utf-8')
              assert '/nuvio/assets/wordmark.webp?v=' + old in content, filename
              assert '/nuvio/assets/mark.png?v=' + old in content, filename
              content = content.replace('/nuvio/assets/wordmark.webp', '/nuvio/assets/wordmark.png')
              content = content.replace(old, new)
              path.write_text(content, encoding='utf-8')

          tests = Path('tests/test_card.cjs')
          content = tests.read_text(encoding='utf-8')
          old_signature = "assert.equal(localAssets.readFileSync('custom_components/nuvio/frontend/assets/wordmark.webp').subarray(8,12).toString(),'WEBP');"
          new_signature = "assert.deepEqual([...localAssets.readFileSync('custom_components/nuvio/frontend/assets/wordmark.png').subarray(0,8)],[137,80,78,71,13,10,26,10]);"
          assert old_signature in content
          content = content.replace(old_signature, new_signature)
          content = content.replace('/nuvio/assets/wordmark.webp', '/nuvio/assets/wordmark.png')
          content = content.replace(old, new)
          needle = "assert.doesNotMatch(cardSource,/https:\\/\\/nuvio\\.tv\\/assets\\/nuvio-app-logo-wordmark\\.webp/);"
          assert needle in content
          content = content.replace(needle, needle + "\nassert.doesNotMatch(cardSource,/\\/nuvio\\/assets\\/wordmark\\.webp/);")
          tests.write_text(content, encoding='utf-8')

          manifest = Path('custom_components/nuvio/manifest.json')
          content = manifest.read_text(encoding='utf-8')
          assert content.count('"version": "' + old + '"') == 1
          manifest.write_text(content.replace('"version": "' + old + '"', '"version": "' + new + '"'), encoding='utf-8')

          docs = Path('docs/popup-card.md')
          with docs.open('a', encoding='utf-8') as out:
              out.write('\nFrom v0.4.75, both images are the official `NuvioMedia/NuvioTV` `dev` branch PNG assets: `app_logo_wordmark.png` for the horizontal wordmark and `app_logo_mark.png` for the vertical/logo-only mark. The integration packages them in `frontend/assets/` and Home Assistant serves `/nuvio/assets/wordmark.png` and `/nuvio/assets/mark.png` locally; dashboard loads do not contact upstream hosts.\n')
          print('Verified upstream PNGs by Git blob SHA, replaced local wordmark, updated routes, tests, and version.')
          PY
      - name: Validate frontend, backend, and bundled image tests
        shell: bash
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
          grep -F 'NUVIO-CARD v0.4.75' custom_components/nuvio/frontend/nuvio-card.js
          grep -F '<span class="card-version">v0.4.75</span>' custom_components/nuvio/frontend/nuvio-card.js
          test ! -e custom_components/nuvio/frontend/assets/wordmark.webp
          git diff --check
      - name: Commit validated official logo assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nuvio/manifest.json custom_components/nuvio/frontend.py custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/frontend/assets tests/test_card.cjs docs/popup-card.md
          git commit -m 'Use official NuvioTV dev PNG wordmark for local branding (v0.4.75)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
