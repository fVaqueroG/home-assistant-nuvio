name: Apply Nuvio popup launcher layouts
on:
  push:
    branches:
      - feature/popup-launcher-three-styles
    paths:
      - .github/workflows/apply-popup-launcher-layouts.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement vertical logo, horizontal logo and icon with text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          folder = Path('custom_components/nuvio/frontend')
          standalone = folder / 'nuvio-popup-card.js'
          source = standalone.read_text()
          assert 'class NuvioPopupCard extends HTMLElement' in source
          assert 'class NuvioPopupCardEditor extends HTMLElement' in source
          source = source.replace('static getStubConfig() { return {button_label: "Nuvio", popup_width: "wide"}; }', 'static getStubConfig() { return {button_label: "Nuvio", button_style: "horizontal", popup_width: "wide"}; }', 1)
          source = source.replace('  getCardSize() { return 1; }', '''  getCardSize() { return this.launcherStyle() === "vertical" ? 2 : 1; }
          launcherStyle() {
            // Old cards that saved an icon must keep showing that icon unless
            // their owner explicitly picks a different layout.
            const style = String(this._config.button_style || "").trim();
            if (["vertical", "horizontal", "icon_text"].includes(style)) return style;
            return String(this._config.button_icon || "").trim() ? "icon_text" : "horizontal";
          }''', 1)
          begin = source.index('  render() {', source.index('class NuvioPopupCard extends HTMLElement'))
          end = source.index('  openPopup() {', begin)
          replacement = '''  render() {
            const label = String(this._config.button_label ?? "Nuvio");
            const icon = String(this._config.button_icon ?? "").trim();
            const style = this.launcherStyle();
            this.shadowRoot.innerHTML = `<style>
              :host{display:block}ha-card{height:56px;box-sizing:border-box}
              ha-card.launcher-vertical{height:96px}
              button{box-sizing:border-box;width:100%;height:100%;border:0;border-radius:var(--ha-card-border-radius,12px);padding:0 12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;background:transparent;color:var(--primary-text-color);font:inherit;font-weight:600}
              button:hover{background:var(--secondary-background-color)}button:focus-visible{outline:2px solid var(--primary-color);outline-offset:-3px}
              ha-icon{color:var(--primary-color);--mdc-icon-size:25px}
              .launcher-visual{min-width:0;display:flex;align-items:center;justify-content:center}
              .launcher-logo{display:block;width:120px;max-width:100%;height:auto;max-height:38px;object-fit:contain}
              .launcher-mark{display:block;width:46px;height:46px;max-width:100%;object-fit:contain}
              .launcher-caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .launcher-vertical button{flex-direction:column;gap:5px;padding:6px 8px}
              .launcher-vertical .launcher-caption{font-size:13px;line-height:17px;max-width:100%}
            </style><ha-card class="launcher-${style}"><button type="button" aria-label="Open Nuvio"><span class="launcher-visual"></span><span class="launcher-caption"></span></button></ha-card>`;
            const visual = this.shadowRoot.querySelector(".launcher-visual");
            if (style === "icon_text") {
              const selected = document.createElement("ha-icon");
              selected.setAttribute("icon", icon || "mdi:television-play");
              visual.appendChild(selected);
            } else {
              const logo = document.createElement("img");
              logo.className = style === "vertical" ? "launcher-mark" : "launcher-logo";
              logo.src = style === "vertical"
                ? "https://raw.githubusercontent.com/NuvioMedia/NuvioTVSmart/main/assets/brand/app_logo_mark.png"
                : "https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp";
              logo.alt = "";
              logo.addEventListener("error", () => {
                const fallback = document.createElement("strong");
                fallback.textContent = style === "vertical" ? "N" : "Nuvio";
                logo.replaceWith(fallback);
              });
              visual.appendChild(logo);
            }
            const caption = this.shadowRoot.querySelector(".launcher-caption");
            caption.textContent = label;
            // Horizontal wordmark already includes the brand name; stacked logo
            // and icon layouts always show the configured caption below/beside.
            caption.style.display = style === "horizontal" && label.trim().toLowerCase() === "nuvio" ? "none" : "";
            this.shadowRoot.querySelector("button").addEventListener("click", () => this.openPopup());
          }
          '''
          source = source[:begin] + replacement + source[end:]
          assert '<label>Popup size<select data-field="popup_width">' in source
          source = source.replace('<label>Popup size<select data-field="popup_width">', '<label>Button appearance<select data-field="button_style"><option value="vertical">Vertical logo</option><option value="horizontal">Horizontal logo</option><option value="icon_text">Icon + text</option></select></label><label>Popup size<select data-field="popup_width">', 1)
          source = source.replace('placeholder="Leave blank for Nuvio logo"', 'placeholder="mdi:television-play"', 1)
          source = source.replace('Leave empty to use the official Nuvio logo.', 'Used for Icon + text; leave blank for the default TV icon.', 1)
          selector = '    const popupSize=this.shadowRoot.querySelector("select[data-field=popup_width]");'
          assert selector in source
          source = source.replace(selector, '''    const buttonStyle=this.shadowRoot.querySelector("select[data-field=button_style]");
            buttonStyle.value=["vertical","horizontal","icon_text"].includes(this._config.button_style)
              ? this._config.button_style
              : (String(this._config.button_icon||"").trim()?"icon_text":"horizontal");
            buttonStyle.addEventListener("change",()=>this.emit({...this._config,button_style:buttonStyle.value}));
          ''' + selector, 1)
          standalone.write_text(source)

          bundled = folder / 'nuvio-card.js'
          card = bundled.read_text()
          marker = '// Nuvio popup button. Bundled after nuvio-card.js so HACS loads both card types'
          assert card.count(marker) == 1 and source.startswith(marker)
          card = card.split(marker, 1)[0].replace('v0.4.71', 'v0.4.72') + source
          assert card.count('class NuvioPopupCard extends HTMLElement') == 1
          bundled.write_text(card)
          manifest = Path('custom_components/nuvio/manifest.json')
          data = json.loads(manifest.read_text())
          assert data['version'] == '0.4.71', data['version']
          data['version'] = '0.4.72'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          tests = Path('tests/test_card.cjs')
          t = tests.read_text()
          assert 'launcher.remove();' in t
          added = '''// New appearance choices: official Nuvio mark stacked above its name,
          // original wordmark horizontal, and custom MDI icon with caption.
          launcher.setConfig({type:'custom:nuvio-popup-card',button_style:'vertical',button_label:'Nuvio'});
          assert.equal(launcher.getCardSize(),2);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-mark').getAttribute('src'),'https://raw.githubusercontent.com/NuvioMedia/NuvioTVSmart/main/assets/brand/app_logo_mark.png');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-caption').textContent,'Nuvio');
          assert.notEqual(launcher.shadowRoot.querySelector('.launcher-caption').style.display,'none');
          launcher.setConfig({type:'custom:nuvio-popup-card',button_style:'horizontal',button_icon:'mdi:star',button_label:'Nuvio'});
          assert.equal(launcher.getCardSize(),1);
          assert.equal(launcher.shadowRoot.querySelector('.launcher-logo').getAttribute('src'),'https://nuvio.tv/assets/nuvio-app-logo-wordmark.webp');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon'),null);
          launcher.setConfig({type:'custom:nuvio-popup-card',button_style:'icon_text',button_label:'Watch'});
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon').getAttribute('icon'),'mdi:television-play');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-caption').textContent,'Watch');
          launcher.setConfig({type:'custom:nuvio-popup-card',button_style:'icon_text',button_icon:'mdi:movie-open',button_label:'Movies'});
          assert.equal(launcher.shadowRoot.querySelector('.launcher-visual ha-icon').getAttribute('icon'),'mdi:movie-open');
          assert.equal(launcher.shadowRoot.querySelector('.launcher-logo'),null);
          assert.match(cardSource,/Button appearance<select data-field="button_style"/);
          assert.match(cardSource,/buttonStyle.addEventListener\\("change",\\(\\)=>this.emit/);
          '''
          t = t.replace('launcher.remove();', added + 'launcher.remove();', 1)
          t = t.replace('assert.match(cardSource,/Leave empty to use the official Nuvio logo/);', 'assert.match(cardSource,/Used for Icon \\+ text/);', 1)
          tests.write_text(t)
          docs = Path('docs/popup-card.md')
          d = docs.read_text()
          d += '\nPopup launcher appearance: set `button_style: horizontal` (default official wordmark), `button_style: vertical` (official Nuvio mark stacked above the button label), or `button_style: icon_text` (MDI icon beside the button label). Choose the same values in the visual editor under **Button appearance**. For `icon_text`, set `button_icon: mdi:movie-open` to choose an icon, or omit it for the default TV icon. Existing cards with a saved `button_icon` and no `button_style` retain their icon + text layout; explicitly choosing Horizontal or Vertical overrides it. Vertical launcher uses a taller dashboard button; popup size remains controlled separately by `popup_width`.\n'
          docs.write_text(d)
          PY
      - name: Validate JS syntax and integration
        run: |
          node --check custom_components/nuvio/frontend/nuvio-card.js
          node --check custom_components/nuvio/frontend/nuvio-popup-card.js
          python -m compileall -q custom_components/nuvio
          npm ci --prefix tests
          node tests/test_card.cjs
      - name: Commit launcher styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nuvio/frontend/nuvio-card.js custom_components/nuvio/frontend/nuvio-popup-card.js custom_components/nuvio/manifest.json tests/test_card.cjs docs/popup-card.md
          git commit -m "Add three popup launcher appearance options (v0.4.72)"
          git push
