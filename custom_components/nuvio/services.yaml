open:
  name: Open title
  description: Open Nuvio for a movie or series on Android TV or LG webOS.
  target:
    entity:
      domain: media_player
  fields:
    media_type:
      required: true
      selector:
        select:
          options:
            - movie
            - series
    content_id:
      required: true
      example: tt16311594
      selector:
        text:

play:
  name: Play title
  description: Start Nuvio on ADB-based Android TV or LG webOS. Android supports direct stream launch; webOS receives launch metadata for compatible Nuvio TV builds.
  target:
    entity:
      domain: media_player
  fields:
    media_type:
      required: true
      selector:
        select:
          options:
            - movie
            - series
    content_id:
      required: true
      example: tt16311594
      selector:
        text:
    video_id:
      selector:
        text:
    title:
      required: true
      selector:
        text:
    poster:
      selector:
        text:
          type: url
    backdrop:
      selector:
        text:
          type: url
    logo:
      selector:
        text:
          type: url
    season:
      selector:
        number:
          min: 0
          max: 999
          mode: box
    episode:
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    episode_title:
      selector:
        text:

